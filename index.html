<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Studio</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Шапка -->
        <header class="header">
            <h1>🎵 Audio Studio</h1>
            <button class="close-btn" onclick="telegram.close()">✕</button>
        </header>

        <!-- Основной контент -->
        <main class="main-content">
            <!-- Информация о файле -->
            <div class="file-info-card glass-effect">
                <div class="file-icon">🎧</div>
                <div class="file-details">
                    <h3>Текущий файл</h3>
                    <p id="fileName">Не выбран</p>
                    <div class="file-meta">
                        <span id="fileDuration">0:00</span>
                        <span id="fileSize">0 KB</span>
                    </div>
                </div>
            </div>

            <!-- Вкладки эффектов -->
            <div class="tabs">
                <button class="tab active" data-tab="basic">Основные</button>
                <button class="tab" data-tab="advanced">Расширенные</button>
                <button class="tab" data-tab="export">Экспорт</button>
            </div>

            <!-- Вкладка "Основные" -->
            <div class="tab-content active" id="basic-tab">
                <!-- Громкость -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">🔊</span>
                        <h3>Громкость</h3>
                    </div>
                    <div class="effect-control">
                        <input type="range" id="volumeSlider" min="-20" max="20" value="0" step="1">
                        <div class="value-display">
                            <span id="volumeValue">0 dB</span>
                            <div class="preset-buttons">
                                <button class="preset-btn" onclick="setVolume(-5)">-5dB</button>
                                <button class="preset-btn" onclick="setVolume(0)">0dB</button>
                                <button class="preset-btn" onclick="setVolume(5)">+5dB</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Скорость -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">▶️</span>
                        <h3>Скорость</h3>
                    </div>
                    <div class="effect-control">
                        <input type="range" id="speedSlider" min="0.5" max="2" value="1" step="0.1">
                        <div class="value-display">
                            <span id="speedValue">1.0x</span>
                            <div class="preset-buttons">
                                <button class="preset-btn" onclick="setSpeed(0.75)">0.75x</button>
                                <button class="preset-btn" onclick="setSpeed(1)">1.0x</button>
                                <button class="preset-btn" onclick="setSpeed(1.5)">1.5x</button>
                                <button class="preset-btn" onclick="setSpeed(2)">2.0x</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Обрезка -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">✂️</span>
                        <h3>Обрезка</h3>
                    </div>
                    <div class="effect-control">
                        <div class="range-inputs">
                            <div class="input-group">
                                <label>От</label>
                                <input type="text" id="startTime" placeholder="0:00" value="0:00">
                            </div>
                            <div class="input-group">
                                <label>До</label>
                                <input type="text" id="endTime" placeholder="3:30" value="3:30">
                            </div>
                        </div>
                        <div class="waveform-container">
                            <canvas id="waveform" width="300" height="60"></canvas>
                            <div class="waveform-handles">
                                <div class="handle left" id="leftHandle"></div>
                                <div class="handle right" id="rightHandle"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Вкладка "Расширенные" -->
            <div class="tab-content" id="advanced-tab">
                <!-- Частота дискретизации -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">🎚️</span>
                        <h3>Частота дискретизации</h3>
                    </div>
                    <select class="modern-select" id="sampleRate">
                        <option value="original">Оригинал (44100 Гц)</option>
                        <option value="22050">22050 Гц</option>
                        <option value="44100">44100 Гц</option>
                        <option value="48000">48000 Гц</option>
                        <option value="96000">96000 Гц</option>
                    </select>
                </div>

                <!-- Каналы -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">🔊</span>
                        <h3>Каналы</h3>
                    </div>
                    <div class="channel-selector">
                        <button class="channel-btn active" onclick="setChannels('original')">Оригинал</button>
                        <button class="channel-btn" onclick="setChannels('mono')">Моно</button>
                        <button class="channel-btn" onclick="setChannels('stereo')">Стерео</button>
                    </div>
                </div>

                <!-- Битность -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">📊</span>
                        <h3>Битность</h3>
                    </div>
                    <div class="bit-depth-selector">
                        <button class="depth-btn active" onclick="setBitDepth('original')">Оригинал</button>
                        <button class="depth-btn" onclick="setBitDepth(8)">8 бит</button>
                        <button class="depth-btn" onclick="setBitDepth(16)">16 бит</button>
                        <button class="depth-btn" onclick="setBitDepth(24)">24 бит</button>
                        <button class="depth-btn" onclick="setBitDepth(32)">32 бит</button>
                    </div>
                </div>
            </div>

            <!-- Вкладка "Экспорт" -->
            <div class="tab-content" id="export-tab">
                <!-- Формат -->
                <div class="effect-card glass-effect">
                    <div class="effect-header">
                        <span class="effect-icon">💾</span>
                        <h3>Формат файла</h3>
                    </div>
                    <div class="format-selector">
                        <button class="format-btn active" onclick="setFormat('mp3')">MP3</button>
                        <button class="format-btn" onclick="setFormat('wav')">WAV</button>
                        <button class="format-btn" onclick="setFormat('ogg')">OGG</button>
                        <button class="format-btn" onclick="setFormat('m4a')">M4A</button>
                    </div>
                </div>

                <!-- Качество MP3 -->
                <div class="effect-card glass-effect" id="mp3Quality">
                    <div class="effect-header">
                        <span class="effect-icon">⚡</span>
                        <h3>Качество MP3</h3>
                    </div>
                    <div class="quality-selector">
                        <button class="quality-btn" onclick="setBitrate('64k')">64 kbps</button>
                        <button class="quality-btn active" onclick="setBitrate('128k')">128 kbps</button>
                        <button class="quality-btn" onclick="setBitrate('192k')">192 kbps</button>
                        <button class="quality-btn" onclick="setBitrate('256k')">256 kbps</button>
                        <button class="quality-btn" onclick="setBitrate('320k')">320 kbps</button>
                    </div>
                </div>

                <!-- Кнопка экспорта -->
                <button class="export-btn" onclick="exportAudio()">
                    <span>🎵 Обработать и отправить</span>
                </button>
            </div>
        </main>

        <!-- Нижняя панель -->
        <footer class="footer">
            <button class="apply-btn" onclick="applyEffects()">Применить эффекты</button>
            <button class="reset-btn" onclick="resetEffects()">Сбросить</button>
        </footer>
    </div>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="app.js"></script>
</body>
</html>
